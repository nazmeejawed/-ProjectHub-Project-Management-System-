<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isNew ? 'New Task' : 'Edit Task'} + ' — Project Manager'">Task Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar('tasks')}"></div>

    <main class="main-content">
        <div class="page-header">
            <div>
                <button class="menu-toggle" id="menuToggle">☰</button>
                <h2 th:text="${isNew ? 'New Task' : 'Edit Task'}">Task Form</h2>
                <p th:text="${isNew ? 'Create a new task' : 'Update task details'}">Form</p>
            </div>
        </div>

        <div class="page-body">
            <div class="card form-container">
                <form th:action="@{/tasks/save}" method="post" th:object="${task}">
                    <input type="hidden" th:field="*{id}">

                    <div class="form-group">
                        <label for="title">Task Title *</label>
                        <input type="text" id="title" class="form-control" th:field="*{title}"
                               placeholder="Enter task title" required>
                        <div th:if="${#fields.hasErrors('title')}" class="form-error" th:errors="*{title}">Error</div>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" class="form-control" th:field="*{description}"
                                  placeholder="Describe the task requirements"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="projectId">Project *</label>
                        <select id="projectId" class="form-control" name="projectId" required>
                            <option value="">— Select Project —</option>
                            <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}"
                                    th:selected="${task.project != null && task.project.id == p.id}">Project</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="status">Status *</label>
                            <select id="status" class="form-control" th:field="*{status}" required>
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}">Status</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="priority">Priority *</label>
                            <select id="priority" class="form-control" th:field="*{priority}" required>
                                <option th:each="p : ${priorities}" th:value="${p}" th:text="${p.displayName}">Priority</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="assigneeId">Assignee</label>
                            <select id="assigneeId" class="form-control" name="assigneeId">
                                <option value="">— Unassigned —</option>
                                <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name}"
                                        th:selected="${task.assignee != null && task.assignee.id == m.id}">Member</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="deadline">Deadline</label>
                            <input type="date" id="deadline" class="form-control" th:field="*{deadline}">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary"
                                th:text="${isNew ? 'Create Task' : 'Update Task'}">Save</button>
                        <a th:href="@{/tasks}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
