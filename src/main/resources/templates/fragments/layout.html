<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' — Project Manager' : 'Project Manager'}">Project Manager</title>
    <meta name="description" content="Project Management Application for Project Managers">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout" th:fragment="layout(content, activePage)">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h1>
                <span class="brand-icon">P</span>
                Project Manager
            </h1>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-label">Main</div>
            <a th:href="@{/}" class="nav-link" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
                <span class="nav-icon">📊</span> Dashboard
            </a>
            <a th:href="@{/projects}" class="nav-link" th:classappend="${activePage == 'projects' ? 'active' : ''}">
                <span class="nav-icon">📁</span> Projects
            </a>
            <a th:href="@{/tasks}" class="nav-link" th:classappend="${activePage == 'tasks' ? 'active' : ''}">
                <span class="nav-icon">✅</span> Tasks
            </a>

            <div class="nav-label">Organization</div>
            <a th:href="@{/team}" class="nav-link" th:classappend="${activePage == 'team' ? 'active' : ''}">
                <span class="nav-icon">👥</span> Team
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div th:replace="${content}"></div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
