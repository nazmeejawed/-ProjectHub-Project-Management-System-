<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' — Project Manager' : 'Project Manager'}">Project Manager</title>
    <meta name="description" content="Project Management Application for Project Managers">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout" th:fragment="layout(content, activePage)">

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar(${activePage})}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div th:replace="${content}"></div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
