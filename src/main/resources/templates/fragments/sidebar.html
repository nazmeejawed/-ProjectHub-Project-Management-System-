<!-- Sidebar Fragment — Promage Style -->
<aside class="sidebar" xmlns:th="http://www.thymeleaf.org" th:fragment="sidebar(activePage)">
    <div class="sidebar-brand">
        <h1>
            <span class="brand-icon-promage">
                <!-- Simple sun/gear svg for Promage logo -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L14.4 5.6L18.7 5L19.4 9.3L23 11.7L20.6 15.3L21.3 19.6L17 19L14.6 22.6L11 20.2L7.4 22.6L5 19L0.7 19.6L1.4 15.3L-1 11.7L2.6 9.3L3.3 5L7.6 5.6L10 2H12Z" fill="var(--primary)"/>
                    <circle cx="11" cy="12.3" r="4" fill="var(--bg-sidebar)"/>
                </svg>
            </span>
            Promage
        </h1>
    </div>
    
    <div class="sidebar-action">
        <a th:href="@{/projects/new}" class="btn-create-project">
            <span class="btn-icon-circle">+</span> Create new project
        </a>
    </div>

    <nav class="sidebar-nav">
        <a th:href="@{/}" class="nav-link" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
            <span class="nav-icon">⊞</span> Dashboard
        </a>
        <a th:href="@{/projects}" class="nav-link" th:classappend="${activePage == 'projects' ? 'active' : ''}">
            <span class="nav-icon">💼</span> Projects
        </a>
        <a th:href="@{/tasks}" class="nav-link" th:classappend="${activePage == 'tasks' ? 'active' : ''}">
            <span class="nav-icon">☰</span> Tasks
        </a>
        <a href="#" class="nav-link">
            <span class="nav-icon">⏱</span> Time log
        </a>
        <a href="#" class="nav-link">
            <span class="nav-icon">⚖</span> Resource mgnt
        </a>
        <a th:href="@{/team}" class="nav-link" th:classappend="${activePage == 'team' ? 'active' : ''}">
            <span class="nav-icon">👥</span> Users
        </a>
        <a href="#" class="nav-link">
            <span class="nav-icon">📑</span> Project template
        </a>
        <a href="#" class="nav-link">
            <span class="nav-icon">⚙</span> Menu settings
        </a>
    </nav>
</aside>
