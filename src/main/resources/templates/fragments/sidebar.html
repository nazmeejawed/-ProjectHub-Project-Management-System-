<!-- Sidebar Fragment — Zoho Projects Style -->
<aside class="sidebar" xmlns:th="http://www.thymeleaf.org" th:fragment="sidebar(activePage)">
    <div class="sidebar-brand">
        <h1>
            <span class="brand-icon">P</span>
            Projects
        </h1>
    </div>
    <nav class="sidebar-nav">
        <div class="nav-label">Main</div>
        <a th:href="@{/}" class="nav-link" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
            <span class="nav-icon">🏠</span> Home
        </a>
        <a th:href="@{/projects}" class="nav-link" th:classappend="${activePage == 'projects' ? 'active' : ''}">
            <span class="nav-icon">📁</span> Projects
        </a>
        <a th:href="@{/tasks}" class="nav-link" th:classappend="${activePage == 'tasks' ? 'active' : ''}">
            <span class="nav-icon">✅</span> Tasks
        </a>

        <div class="nav-label">Organization</div>
        <a th:href="@{/team}" class="nav-link" th:classappend="${activePage == 'team' ? 'active' : ''}">
            <span class="nav-icon">👥</span> Users
        </a>
    </nav>
    
    <!-- Theme Toggle -->
    <div class="theme-switch-wrapper" style="padding: 0 1.25rem 1.25rem; border-top: 1px solid var(--border-sidebar); margin-top: auto; padding-top: 1.25rem;">
        <button id="themeToggleBtn" class="btn btn-secondary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; background: transparent; border: 1px solid var(--border-sidebar); color: var(--text-sidebar); transition: var(--transition);">
            <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
            <span id="themeText">Light Mode</span>
        </button>
    </div>
</aside>
