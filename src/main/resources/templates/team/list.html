<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team — Project Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar('team')}"></div>

    <main class="main-content">
        <div class="page-header">
            <div>
                <button class="menu-toggle" id="menuToggle">☰</button>
                <h2>Team</h2>
                <p>Manage your team members</p>
            </div>
            <a th:href="@{/team/new}" class="btn btn-primary">+ Add Member</a>
        </div>

        <div class="page-body">
            <div th:if="${successMessage}" class="alert alert-success">
                <span>✓</span>
                <span th:text="${successMessage}"></span>
            </div>

            <div class="team-grid" th:if="${members != null && !members.isEmpty()}">
                <div class="member-card" th:each="member : ${members}">
                    <div class="member-avatar" th:text="${member.initials}">AB</div>
                    <div class="member-info" style="flex: 1;">
                        <h3 th:text="${member.name}">Name</h3>
                        <div class="member-email" th:text="${member.email}">email@example.com</div>
                        <div class="member-meta">
                            <span class="badge"
                                  th:classappend="'badge-' + ${member.role.name().toLowerCase()}"
                                  th:text="${member.role.displayName}">Role</span>
                            <span class="text-muted" th:text="${member.projects.size()} + ' projects'">0 projects</span>
                        </div>
                    </div>
                    <div class="member-actions">
                        <a th:href="@{/team/{id}/edit(id=${member.id})}" class="btn btn-secondary btn-sm btn-icon">✏️</a>
                        <form th:action="@{/team/{id}/delete(id=${member.id})}" method="post" class="delete-form">
                            <button type="submit" class="btn btn-danger btn-sm btn-icon">🗑️</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="empty-state" th:if="${members == null || members.isEmpty()}">
                <div class="empty-icon">👥</div>
                <h3>No team members yet</h3>
                <p>Add team members to start assigning tasks and projects.</p>
                <a th:href="@{/team/new}" class="btn btn-primary">+ Add Member</a>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
