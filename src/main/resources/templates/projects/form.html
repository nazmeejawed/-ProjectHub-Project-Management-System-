<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isNew ? 'New Project' : 'Edit Project'} + ' — Project Manager'">Project Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar('projects')}"></div>

    <main class="main-content">
        <div class="page-header">
            <div>
                <button class="menu-toggle" id="menuToggle">☰</button>
                <h2 th:text="${isNew ? 'New Project' : 'Edit Project'}">Project Form</h2>
                <p th:text="${isNew ? 'Create a new project' : 'Update project details'}">Form</p>
            </div>
        </div>

        <div class="page-body">
            <div class="card form-container">
                <form th:action="@{/projects/save}" method="post" th:object="${project}">
                    <input type="hidden" th:field="*{id}">

                    <div class="form-group">
                        <label for="name">Project Name *</label>
                        <input type="text" id="name" class="form-control" th:field="*{name}"
                               placeholder="Enter project name" required>
                        <div th:if="${#fields.hasErrors('name')}" class="form-error" th:errors="*{name}">Error</div>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" class="form-control" th:field="*{description}"
                                  placeholder="Describe the project goals and scope"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="status">Status *</label>
                            <select id="status" class="form-control" th:field="*{status}" required>
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}">Status</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="managerId">Project Manager</label>
                            <select id="managerId" class="form-control" name="managerId">
                                <option value="">— Select Manager —</option>
                                <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name}"
                                        th:selected="${project.manager != null && project.manager.id == m.id}">Member</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="startDate">Start Date</label>
                            <input type="date" id="startDate" class="form-control" th:field="*{startDate}">
                        </div>
                        <div class="form-group">
                            <label for="endDate">End Date</label>
                            <input type="date" id="endDate" class="form-control" th:field="*{endDate}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="memberIds">Team Members</label>
                        <select id="memberIds" class="form-control" name="memberIds" multiple>
                            <option th:each="m : ${members}" th:value="${m.id}"
                                    th:text="${m.name + ' (' + m.role.displayName + ')'}"
                                    th:selected="${project.members.contains(m)}">Member</option>
                        </select>
                        <div class="hint">Hold Ctrl/Cmd to select multiple members</div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary"
                                th:text="${isNew ? 'Create Project' : 'Update Project'}">Save</button>
                        <a th:href="@{/projects}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
