<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Promage</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .auth-container {
            background: var(--bg-white);
            padding: 2rem;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 400px;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-header h2 {
            color: var(--text-heading);
            margin-bottom: 0.5rem;
        }
        .auth-header p {
            color: var(--text-secondary);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-heading);
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            outline: none;
            transition: var(--transition);
        }
        .form-control:focus {
            border-color: var(--primary);
        }
        .btn-primary {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-pill);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-primary:hover {
            background: var(--primary-hover);
        }
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
        }
        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
        }
        .alert {
            padding: 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        .alert-error {
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .alert-success {
            background: var(--success-bg);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Please enter your details to sign in.</p>
    </div>

    <!-- Error message -->
    <div th:if="${param.error}" class="alert alert-error">
        Invalid email or password.
    </div>

    <!-- Logout message -->
    <div th:if="${param.logout}" class="alert alert-success">
        You have been logged out successfully.
    </div>
    
    <!-- Success registration message -->
    <div th:if="${param.success}" class="alert alert-success">
        Registration successful! Please login.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="username" class="form-control" placeholder="Enter your email" required autofocus>
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>
        
        <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
            <input type="checkbox" id="remember-me" name="remember-me">
            <label for="remember-me" class="form-label" style="margin-bottom: 0; font-weight: normal; font-size: 0.9rem;">Remember me</label>
        </div>

        <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <div class="auth-footer">
        <p>Don't have an account? <a th:href="@{/register}">Sign up</a></p>
    </div>
</div>

</body>
</html>
